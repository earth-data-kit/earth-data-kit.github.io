<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting | Earth Data Kit</title>

  <!-- Redirect fallback (2 seconds) -->
  <meta http-equiv="refresh" content="2; url=https://earthlabs.io/earth-data-kit/">

  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: "Plus Jakarta Sans", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      transition: opacity 1s ease;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #8b949e;
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    /* Fade effect */
    .fade-out {
      opacity: 0;
    }

    /* Spinner animation */
    .spinner {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      margin: 0 4px;
      background-color: #58a6ff;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }
    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }
  </style>

  <script>
    // Add fade-out before redirect
    setTimeout(() => {
      document.body.classList.add("fade-out");
    }, 1500);

    setTimeout(() => {
      window.location.href = "https://earthlabs.io/earth-data-kit/";
    }, 2500);
  </script>
</head>

<body>
  <h1>🌍 Redirecting to Earth Data Kit Docs</h1>
  <p>You’ll be taken to our updated documentation shortly...</p>

  <div class="spinner">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <p>If not redirected automatically, <a href="https://earthlabs.io/earth-data-kit/">click here</a>.</p>
</body>
</html>
